name: Validate and publish docket

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - name: Install OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv run ruff check packages scripts tests
      - run: uv run mypy
      - run: uv run pytest --cov=packages --cov-branch --cov-report=term-missing --cov-fail-under=80
      - run: uv run python scripts/check_persistence.py
      - run: uv run python scripts/render_reports.py --check
      - run: uv run python scripts/quality_gates.py
      - run: uv run python scripts/validate_palette.py
      - run: uv run python scripts/build_notebooks.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: uv run python scripts/scan_for_planted_identifiers.py
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
