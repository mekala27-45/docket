[project]
name = "docket-document-intelligence"
version = "0.1.0"
description = "Document intelligence with measured OCR, extraction, and human review."
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "pyarrow>=19,<22", "scikit-learn>=1.6,<2", "pillow>=11,<13", "pytesseract>=0.3.13", "reportlab>=4,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3", "pydantic>=2.10,<3", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20", "jinja2>=3.1,<4", "pypdfium2>=4,<6", "scipy>=1.14,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<3", "hypothesis>=6,<7", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["packages"]
[[tool.mypy.overrides]]
module = ["sklearn.*", "pytesseract.*", "reportlab.*", "pypdfium2.*", "pandas.*", "scipy.*", "pyarrow.*"]
ignore_missing_imports = true
[tool.coverage.run]
source = ["packages"]
branch = true
